name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test 2>&1 | tee test-output.log

      - name: Coverage summary
        if: always()
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          # turbo interleaves the packages' output, so group lines by their "<package>:test:" prefix
          # and print each package's coverage table (first dashed line through the third) separately.
          awk '
            match($0, /[^ ]+:test: ?/) {
              pkg = substr($0, RSTART, index(substr($0, RSTART), ":test:") - 1)
              line = substr($0, RSTART + RLENGTH)
              if (line ~ /^-+\|/) dashes[pkg]++
              if (dashes[pkg] >= 1 && !done[pkg]) {
                if (!(pkg in table)) order[++n] = pkg
                table[pkg] = table[pkg] line "\n"
                if (dashes[pkg] == 3) done[pkg] = 1
              }
            }
            END {
              for (i = 1; i <= n; i++) printf "### %s\n```\n%s```\n", order[i], table[order[i]]
            }
          ' test-output.log >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: packages/*/coverage
          retention-days: 14
